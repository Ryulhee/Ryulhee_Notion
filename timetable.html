<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>텐미닛 타임테이블</title>
<style>
:root{
  --bg:#fff;--fg:#1d1d1f;--mut:#86868b;--line:#c9c9ce;--line2:#e5e5ea;--card:#f5f5f7;--acc:#0071e3;
  --c-work:#4c8bf5;--c-int:#a56cf0;--c-dia:#f5a04c;--c-hea:#4cc38a;--c-per:#9a9aa1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--fg:#f5f5f7;--mut:#98989f;--line:#48484a;--line2:#303034;--card:#2c2c2e;--acc:#2997ff}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{display:grid;grid-template-columns:1fr 1fr 230px;gap:14px;padding:10px 12px;align-items:start}
@media (max-width:760px){.wrap{grid-template-columns:1fr 1fr}.side{grid-column:1/-1}}
@media (max-width:480px){.wrap{grid-template-columns:1fr}}
h1{margin:0 0 4px;font-size:12px;letter-spacing:.14em;font-weight:700;border-bottom:2px solid var(--fg);padding-bottom:2px}
table.tt{border-collapse:collapse;width:100%;table-layout:fixed;user-select:none;-webkit-user-select:none;touch-action:none}
.tt td{height:21px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:0;position:relative}
.tt td.h{width:30px;text-align:center;font-weight:600;font-size:12px;border-left:0}
.tt td.c{cursor:crosshair}
.tt td.c.a{background:var(--col)}
.tt td.c.sel{outline:2px solid var(--acc);outline-offset:-2px;background:color-mix(in srgb,var(--acc) 25%,transparent)}
.tt tr:last-child td{border-bottom:2px solid var(--fg)}
.tt td.now::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;box-shadow:inset 0 0 0 2px #ff3b30}
.tt tr.hnow td.h{color:#ff3b30}
.side{background:var(--card);border-radius:12px;padding:10px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
input[type=time]{width:104px;padding:5px 4px}
input[type=text]{flex:1;min-width:80px}
input[type=date]{width:130px}
button{cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.sw{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.sw button{padding:3px 8px;border:2px solid transparent;color:#fff;font-size:12px}
.sw button.on{border-color:var(--fg)}
.list{max-height:150px;overflow:auto;border-top:1px solid var(--line2);margin-top:6px}
.it{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line2);font-size:12px}
.it i{width:10px;height:10px;border-radius:3px;flex:none}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it button{padding:0 6px;border:0;background:none;color:var(--mut)}
.sum{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.hint{color:var(--mut);font-size:11px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div><h1>TIMETABLE</h1><table class="tt" id="t1"></table></div>
  <div><h1>&nbsp;</h1><table class="tt" id="t2"></table></div>
  <div class="side">
    <div class="row"><input type="date" id="dt"><button id="today">오늘</button></div>
    <div class="sw" id="sw"></div>
    <div class="row"><input type="time" id="st" value="09:00"><span>~</span><input type="time" id="en" value="10:00"></div>
    <div class="row"><input type="text" id="lb" placeholder="할 일 (선택)"><button class="p" id="add">칠하기</button></div>
    <div class="hint">또는 격자를 드래그하면 그 구간이 칠해져요. 새벽(00~05시)은 6시 이후 칸에 이어집니다.</div>
    <div class="list" id="list"></div>
    <div class="sum" id="sum"></div>
  </div>
</div>
<script>
(function(){
var AREAS=[["업무","--c-work"],["관심사","--c-int"],["일기","--c-dia"],["건강","--c-hea"],["개인","--c-per"]];
var area=0,date=ymd(new Date()),blocks=[],dragA=-1,dragB=-1;
var $=function(id){return document.getElementById(id)};
function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function key(){return "tt-"+date}
function load(){try{blocks=JSON.parse(localStorage.getItem(key())||"[]")}catch(e){blocks=[]}}
function save(){try{localStorage.setItem(key(),JSON.stringify(blocks))}catch(e){}}
function hhmm(i){var m=360+i*10;m%=1440;var h=Math.floor(m/60),n=m%60;return (h<10?"0":"")+h+":"+(n<10?"0":"")+n}
function idxOf(t){var p=t.split(":"),m=+p[0]*60+ +p[1];if(m<360)m+=1440;return Math.floor((m-360)/10)}
function build(tb,from){
  var h="";
  for(var r=0;r<12;r++){
    var hr=(6+from+r)%24,lab=hr%12===0?12:hr%12;
    h+='<tr data-r="'+(from+r)+'"><td class="h">'+lab+'</td>';
    for(var c=0;c<6;c++){var i=(from+r)*6+c;h+='<td class="c" data-i="'+i+'"></td>'}
    h+='</tr>';
  }
  tb.innerHTML=h;
}
function paintAll(){
  var cells=document.querySelectorAll("td.c"),map=new Array(144),lab=new Array(144),i;
  blocks.forEach(function(b){for(i=b.s;i<=b.e&&i<144;i++){map[i]=b.a;lab[i]=b.l||AREAS[b.a][0]}});
  var lo=Math.min(dragA,dragB),hi=Math.max(dragA,dragB);
  var now=new Date(),ni=-1;
  if(date===ymd(now)){var nm=now.getHours()*60+now.getMinutes();if(nm<360)nm+=1440;ni=Math.floor((nm-360)/10)}
  for(i=0;i<cells.length;i++){
    var c=cells[i],k=+c.dataset.i,a=map[k];
    c.className="c"+(a!==undefined?" a":"")+(dragA>=0&&k>=lo&&k<=hi?" sel":"")+(k===ni?" now":"");
    c.style.setProperty("--col",a!==undefined?"var("+AREAS[a][1]+")":"");
    c.title=hhmm(k)+(lab[k]?" · "+lab[k]:"");
  }
  document.querySelectorAll("tr[data-r]").forEach(function(r){r.className=(ni>=0&&Math.floor(ni/6)===+r.dataset.r)?"hnow":""});
  var L=$("list");L.innerHTML="";
  blocks.forEach(function(b,n){
    var d=document.createElement("div");d.className="it";
    d.innerHTML='<i style="background:var('+AREAS[b.a][1]+')"></i><span>'+hhmm(b.s)+"–"+hhmm(b.e+1)+" "+esc(b.l||AREAS[b.a][0])+'</span><button title="삭제">✕</button>';
    d.querySelector("button").onclick=function(){blocks.splice(n,1);save();paintAll()};
    L.appendChild(d);
  });
  var tot=AREAS.map(function(){return 0});
  for(i=0;i<144;i++)if(map[i]!==undefined)tot[map[i]]+=10;
  var all=tot.reduce(function(x,y){return x+y},0);
  $("sum").innerHTML=AREAS.map(function(a,k){return tot[k]?'<span>'+a[0]+" "+fmt(tot[k])+"</span>":""}).join("")+'<span><b>합계 '+fmt(all)+"</b></span>";
}
function fmt(m){return Math.floor(m/60)+"시간 "+(m%60)+"분"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function addBlock(s,e){if(e<s){var t=s;s=e;e=t}s=Math.max(0,s);e=Math.min(143,e);blocks.push({s:s,e:e,a:area,l:$("lb").value.trim()});save();paintAll()}
function cellAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.classList&&el.classList.contains("c")?+el.dataset.i:-1}
function down(e){var i=cellAt(e.clientX,e.clientY);if(i<0)return;dragA=dragB=i;paintAll();e.preventDefault()}
function move(e){if(dragA<0)return;var i=cellAt(e.clientX,e.clientY);if(i>=0&&i!==dragB){dragB=i;paintAll()}}
function up(){if(dragA<0)return;var a=dragA,b=dragB;dragA=dragB=-1;addBlock(a,b)}
build($("t1"),0);build($("t2"),12);
["t1","t2"].forEach(function(id){$(id).addEventListener("pointerdown",down)});
window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
var sw=$("sw");
AREAS.forEach(function(a,k){var b=document.createElement("button");b.textContent=a[0];b.style.background="var("+a[1]+")";b.onclick=function(){area=k;mark()};sw.appendChild(b)});
function mark(){Array.prototype.forEach.call(sw.children,function(b,k){b.className=k===area?"on":""})}
$("add").onclick=function(){var s=idxOf($("st").value),e=idxOf($("en").value)-1;if(isNaN(s)||isNaN(e)||e<s)return;addBlock(s,e)};
$("dt").value=date;
$("dt").onchange=function(){if($("dt").value){date=$("dt").value;load();paintAll()}};
$("today").onclick=function(){date=ymd(new Date());$("dt").value=date;load();paintAll()};
mark();load();paintAll();setInterval(paintAll,60000);
})();
</script>
</body>
</html>
